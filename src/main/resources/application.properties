spring.application.name=classholder

server.port=${PORT:8080}

spring.docker.compose.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.security.totp-secret-key=${TOTP_SECRET_KEY}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.security.password-reset-token-ttl-minutes=30

app.feriados.base-url=${FERIADOS_API_URL:https://feriadosapi.com/api/v1}
app.feriados.token=${FERIADOS_API_TOKEN:}
app.feriados.codigo-ibge=${FERIADOS_CODIGO_IBGE:3550308}
app.feriados.sync-cron=0 0 3 * * *
app.feriados.sync-on-startup=true
app.feriados.retry.tentativas=3
app.feriados.retry.intervalo-ms=2000

app.reservas.bloquear-sabado=true