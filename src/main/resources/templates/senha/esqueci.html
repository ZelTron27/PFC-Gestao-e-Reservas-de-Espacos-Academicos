<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Esqueci minha senha - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/publico :: cartao(~{::#conteudo-esqueci}, '26rem')}">
<div id="conteudo-esqueci">
    <h1 class="ch-titulo h5 mb-3">Esqueci minha senha</h1>

    <div th:if="${enviado}">
        <div class="alert alert-success small" role="alert">
            Se o e-mail informado estiver cadastrado, enviamos um link para redefinição de senha.
            Verifique sua caixa de entrada (e a pasta de spam).
        </div>
    </div>

    <div th:unless="${enviado}">
        <p class="text-secondary small mb-4">
            Informe o e-mail cadastrado para receber um link de redefinição de senha.
        </p>

        <form th:action="@{/senha/esqueci}" method="post">
            <div class="mb-4">
                <label class="form-label" for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar link</button>
        </form>
    </div>

    <div class="text-center mt-4">
        <a class="small text-decoration-none" th:href="@{/login}">Voltar para o login</a>
    </div>
</div>
</div>
</body>
</html>
