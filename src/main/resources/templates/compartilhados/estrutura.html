<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class Holder</title>
</head>
<body>
<div th:fragment="estrutura(conteudo, paginaAtiva, usuario)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/classholder.css}">

    <div class="ch-app">
        <aside class="ch-sidebar">
            <div class="ch-marca">
                <strong>Class Holder</strong>
                <span>Gestão Acadêmica</span>
            </div>

            <nav class="ch-nav">
                <a th:href="@{/reservas/espacos}" th:classappend="${paginaAtiva == 'espacos'} ? 'ativo'">Espaços Acadêmicos</a>
                <a th:href="@{/reservas}" th:classappend="${paginaAtiva == 'reservas'} ? 'ativo'">Minhas Reservas</a>
                <a th:href="@{/reservas/todas}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'todas'} ? 'ativo'">Todas as Reservas</a>
                <a th:href="@{/solicitacoes}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'solicitacoes'} ? 'ativo'">Solicitações</a>
                <a th:href="@{/salas}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'salas'} ? 'ativo'">Salas</a>
                <a th:href="@{/equipamentos}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'equipamentos'} ? 'ativo'">Equipamentos</a>
                <a th:href="@{/usuarios}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'usuarios'} ? 'ativo'">Usuários</a>
                <a th:href="@{/feriados}" sec:authorize="hasAnyRole('ADMIN','COORDENACAO')"
                   th:classappend="${paginaAtiva == 'feriados'} ? 'ativo'">Feriados</a>
            </nav>

            <div class="ch-rodape-menu">
                <a th:href="@{/lgpd/privacidade}" target="_blank" rel="noopener">Política de Privacidade</a>
                <a th:href="@{/lgpd/termos}" target="_blank" rel="noopener">Termos de Uso</a>
            </div>
        </aside>

        <div class="ch-principal">
            <header class="ch-topo">
                <div class="d-flex align-items-center justify-content-end gap-3">
                    <div class="text-end">
                        <span class="ch-usuario-nome" th:text="${usuario.name()}">Nome do usuário</span>
                        <span class="ch-usuario-email" th:text="${usuario.email()}">email@classholder.com</span>
                    </div>
                    <span class="badge rounded-pill text-bg-light border" th:text="${usuario.role()}">Professor</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-secondary rounded-pill">Sair</button>
                    </form>
                </div>
            </header>

            <main class="ch-conteudo">
                <div th:replace="${conteudo}"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
