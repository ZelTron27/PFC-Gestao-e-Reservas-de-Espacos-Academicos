<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="paginacao(pagina, caminho)" class="mt-3" th:if="${pagina.totalPages() > 1}" aria-label="Paginação">
    <ul class="pagination mb-0 flex-wrap">
        <li class="page-item" th:classappend="${pagina.page() == 1} ? 'disabled'">
            <a class="page-link" th:href="@{${caminho} + '?' + ${pagina.baseQuery()} + 'pagina=' + ${pagina.page() - 1}}">Anterior</a>
        </li>
        <li class="page-item" th:each="numero : ${#numbers.sequence(1, pagina.totalPages())}"
            th:classappend="${numero == pagina.page()} ? 'active'">
            <a class="page-link" th:href="@{${caminho} + '?' + ${pagina.baseQuery()} + 'pagina=' + ${numero}}" th:text="${numero}">1</a>
        </li>
        <li class="page-item" th:classappend="${pagina.page() == pagina.totalPages()} ? 'disabled'">
            <a class="page-link" th:href="@{${caminho} + '?' + ${pagina.baseQuery()} + 'pagina=' + ${pagina.page() + 1}}">Próxima</a>
        </li>
    </ul>
</nav>
</body>
</html>
