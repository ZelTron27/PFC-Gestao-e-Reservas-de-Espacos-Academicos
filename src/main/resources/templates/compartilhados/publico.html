<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class Holder</title>
</head>
<body>
<div th:fragment="cartao(conteudo, largura)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/classholder.css}">

    <div class="ch-publico">
        <div class="w-100 mx-auto" th:style="'max-width:' + ${largura}">
            <div class="text-center mb-4">
                <span class="ch-publico-marca">Class Holder</span>
            </div>

            <div class="ch-cartao p-4 p-md-5">
                <div th:replace="${conteudo}"></div>
            </div>

            <div class="text-center mt-4">
                <a class="text-muted small text-decoration-none" th:href="@{/lgpd/privacidade}">Política de Privacidade</a>
                <span class="text-muted small mx-2">·</span>
                <a class="text-muted small text-decoration-none" th:href="@{/lgpd/termos}">Termos de Uso</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<div th:fragment="documento(conteudo)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/classholder.css}">

    <div class="container py-4 py-md-5" style="max-width: 920px">
        <div class="mb-4">
            <a class="ch-voltar" th:href="@{/}">&larr; Voltar</a>
        </div>

        <div class="ch-cartao p-4 p-md-5 ch-documento">
            <div th:replace="${conteudo}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
