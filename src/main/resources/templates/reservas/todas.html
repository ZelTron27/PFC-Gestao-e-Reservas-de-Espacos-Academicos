<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todas as reservas - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-todas}, 'todas', ${usuario})}">
<div id="conteudo-todas">
    <h1 class="ch-titulo h3 mb-4">Todas as reservas</h1>

    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

    <div class="ch-cartao p-4">
        <p class="ch-vazio" th:if="${#lists.isEmpty(reservas)}">Nenhuma reserva cadastrada ainda.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(reservas)}">
            <table class="table align-middle ch-tabela mb-0">
                <thead>
                    <tr>
                        <th scope="col">Sala</th>
                        <th scope="col">Professor</th>
                        <th scope="col">Data</th>
                        <th scope="col">Início</th>
                        <th scope="col">Término</th>
                        <th scope="col">Finalidade</th>
                        <th scope="col">Status</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reserva : ${reservas}">
                        <td th:text="${reserva.roomName()}">Sala</td>
                        <td th:text="${reserva.professorName()}">Professor</td>
                        <td th:text="${#temporals.format(reserva.date(), 'dd/MM/yyyy')}">Data</td>
                        <td th:text="${#temporals.format(reserva.startTime(), 'HH:mm')}">Início</td>
                        <td th:text="${#temporals.format(reserva.endTime(), 'HH:mm')}">Término</td>
                        <td th:text="${reserva.purpose()}">Finalidade</td>
                        <td>
                            <span class="badge rounded-pill text-bg-success"
                                  th:if="${reserva.status().name() == 'CONFIRMADA'}">Confirmada</span>
                            <span class="badge rounded-pill text-bg-secondary"
                                  th:if="${reserva.status().name() == 'CANCELADA'}">Cancelada</span>
                        </td>
                        <td class="text-end">
                            <form th:if="${reserva.status().name() == 'CONFIRMADA'}"
                                  th:action="@{/reservas/{id}/cancelar(id=${reserva.id()})}" method="post"
                                  onsubmit="return confirm('Cancelar essa reserva?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
</body>
</html>
