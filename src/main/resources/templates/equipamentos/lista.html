<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipamentos - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-equipamentos}, 'equipamentos', ${usuario})}">
<div id="conteudo-equipamentos">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="ch-titulo h3 m-0">Equipamentos cadastrados</h1>
        <a class="btn btn-primary" th:href="@{/equipamentos/novo}">Novo equipamento</a>
    </div>

    <div class="alert alert-success" role="alert" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

    <form class="ch-cartao p-3 mb-4 d-flex flex-wrap align-items-end gap-3" method="get" th:action="@{/equipamentos}" id="filtros-equipamentos">
        <div>
            <label class="form-label mb-1" for="busca">Nome</label>
            <input type="text" class="form-control" id="busca" name="busca" maxlength="100" th:value="${filtroBusca}">
        </div>
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a class="btn btn-outline-secondary" th:href="@{/equipamentos}">Limpar</a>
    </form>

    <div class="ch-cartao p-4">
        <p class="mb-3" id="total-registros" th:text="${pagina.total()} + ' registro(s) encontrado(s)'">0 registro(s) encontrado(s)</p>
        <p class="ch-vazio" th:if="${#lists.isEmpty(equipamentos)}"
           th:text="${pagina.filtered()} ? 'Nenhum registro encontrado para os filtros informados.' : 'Nenhum equipamento cadastrado ainda.'">Nenhum equipamento cadastrado ainda.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(equipamentos)}">
            <table class="table align-middle ch-tabela mb-0">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equipamento : ${equipamentos}">
                        <td th:text="${equipamento.name()}">Nome</td>
                        <td>
                            <div class="d-flex justify-content-end gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/equipamentos/{id}/editar(id=${equipamento.id()})}">Editar</a>
                                <form th:action="@{/equipamentos/{id}/excluir(id=${equipamento.id()})}" method="post"
                                      onsubmit="return confirm('Excluir esse equipamento? Ele será removido de todas as salas.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav th:replace="~{compartilhados/paginacao :: paginacao(${pagina}, '/equipamentos')}"></nav>
    </div>
</div>
</div>
</body>
</html>
