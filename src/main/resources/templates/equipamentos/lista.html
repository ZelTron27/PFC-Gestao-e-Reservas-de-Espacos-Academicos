<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipamentos - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-equipamentos}, 'equipamentos', ${usuario})}">
<div id="conteudo-equipamentos">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="ch-titulo h3 m-0">Equipamentos cadastrados</h1>
        <a class="btn btn-primary" th:href="@{/equipamentos/novo}">Novo equipamento</a>
    </div>

    <div class="ch-cartao p-4">
        <p class="ch-vazio" th:if="${#lists.isEmpty(equipamentos)}">Nenhum equipamento cadastrado ainda.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(equipamentos)}">
            <table class="table align-middle ch-tabela mb-0">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equipamento : ${equipamentos}">
                        <td th:text="${equipamento.name()}">Nome</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
</body>
</html>
