<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo equipamento - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-equipamento}, 'equipamentos', ${usuario})}">
<div id="conteudo-equipamento">
    <div class="mb-4">
        <a class="ch-voltar" th:href="@{/equipamentos}">&larr; Equipamentos</a>
        <h1 class="ch-titulo h3 mt-2 mb-0">Novo equipamento</h1>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

    <div class="ch-cartao p-4" style="max-width: 520px">
        <form th:action="@{/equipamentos}" th:object="${form}" method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Nome</label>
                <input type="text" class="form-control" id="name" th:field="*{name}"
                       placeholder="Ex: Projetor, Computador">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
    </div>
</div>
</div>
</body>
</html>
