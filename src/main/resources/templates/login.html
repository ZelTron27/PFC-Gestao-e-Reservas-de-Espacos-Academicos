<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/publico :: cartao(~{::#conteudo-login}, '26rem')}">
<div id="conteudo-login">
    <h1 class="ch-titulo h5 mb-1">Entrar</h1>
    <p class="text-secondary small mb-4">Entre com sua conta para continuar.</p>

    <div class="alert alert-danger py-2 small" role="alert" th:if="${param.error}">
        E-mail ou senha inválidos.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">E-mail</label>
            <input type="email" class="form-control" id="username" name="username" required autofocus>
        </div>

        <div class="mb-2">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="mb-4 text-end">
            <a class="small text-decoration-none" th:href="@{/senha/esqueci}">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
</div>
</div>
</body>
</html>
