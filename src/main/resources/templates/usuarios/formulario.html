<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo usuário - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-novo-usuario}, 'usuarios', ${usuario})}">
<div id="conteudo-novo-usuario">
    <div class="mb-4">
        <a class="ch-voltar" th:href="@{/usuarios}">&larr; Usuários</a>
        <h1 class="ch-titulo h3 mt-2 mb-0">Novo usuário</h1>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">Erro</div>

    <div class="ch-cartao p-4" style="max-width: 560px">
        <form th:action="@{/usuarios}" th:object="${form}" method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Nome</label>
                <input type="text" class="form-control" id="name" th:field="*{name}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-mail</label>
                <input type="email" class="form-control" id="email" th:field="*{email}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Senha inicial</label>
                <input type="password" class="form-control" id="password" th:field="*{password}">
                <div class="form-text">
                    Mínimo de 14 caracteres, com letra maiúscula, minúscula, número e símbolo.
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="role">Perfil</label>
                <select class="form-select" id="role" th:field="*{role}">
                    <option value="">Selecione...</option>
                    <option th:each="perfil : ${perfisDisponiveis}" th:value="${perfil}" th:text="${perfil}"></option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
    </div>
</div>
</div>
</body>
</html>
