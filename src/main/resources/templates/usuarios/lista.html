<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários - Class Holder</title>
</head>
<body>
<div th:replace="~{compartilhados/estrutura :: estrutura(~{::#conteudo-usuarios}, 'usuarios', ${usuario})}">
<div id="conteudo-usuarios">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="ch-titulo h3 m-0">Usuários cadastrados</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/novo}">Novo usuário</a>
    </div>

    <div class="ch-cartao p-4">
        <p class="ch-vazio" th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado ainda.</p>

        <div class="table-responsive" th:unless="${#lists.isEmpty(usuarios)}">
            <table class="table align-middle ch-tabela mb-0">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Perfil</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cadastrado : ${usuarios}">
                        <td th:text="${cadastrado.name()}">Nome</td>
                        <td th:text="${cadastrado.email()}">email@exemplo.com</td>
                        <td>
                            <span class="badge rounded-pill text-bg-light border"
                                  th:text="${cadastrado.role()}">PERFIL</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
</body>
</html>
